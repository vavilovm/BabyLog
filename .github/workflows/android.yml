name: BabyLog CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: babylog-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check release versioning
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Android code
        run: ./gradlew spotlessCheck testDebugUnitTest lintDebug
      - name: Build debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BabyLog-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/

  functions-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  release:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [android-quality, functions-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore release configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          BABYLOG_KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf '%s' "$BABYLOG_KEYSTORE_BASE64" | base64 --decode > keystore/babylog-release.jks
      - name: Reserve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py
      - name: Build signed release APK
        env:
          BABYLOG_STORE_FILE: keystore/babylog-release.jks
          BABYLOG_STORE_PASSWORD: ${{ secrets.BABYLOG_STORE_PASSWORD }}
          BABYLOG_KEY_PASSWORD: ${{ secrets.BABYLOG_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreleaseVersionName=${{ steps.version.outputs.name }} -PreleaseVersionCode=${{ steps.version.outputs.code }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BabyLog ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/app-release.apk
